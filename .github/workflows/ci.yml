# ============================================================
# CI - Continuous Integration
# Se ejecuta en cada push y en cada pull request
# Compila el código y ejecuta los tests JUnit
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # PostgreSQL temporal para que los tests puedan conectarse
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levelup_test
          POSTGRES_USER: levelup_test_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verificar versión de Java
        run: java -version

      - name: Compilar proyecto
        run: ./mvnw -B compile

      - name: Ejecutar tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/levelup_test
          SPRING_DATASOURCE_USERNAME: levelup_test_user
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: 86400000
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: meta-llama/llama-3.2-3b-instruct:free
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: 587
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
        run: ./mvnw -B test

      - name: Resumen
        if: always()
        run: echo "Workflow completado. Revisa los resultados de los tests."