# ============================================================
# CI - Continuous Integration
# Se ejecuta en cada push y en cada pull request
# Compila el codigo y ejecuta los tests JUnit con el perfil "test"
#
# El perfil "test" (src/test/resources/application-test.yml) provee
# valores por defecto para JWT_SECRET, desactiva Flyway y JPA validate,
# por lo que no necesitamos BD real ni secretos de GitHub para el CI.
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verificar version de Java
        run: java -version

      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x ./mvnw

      - name: Compilar proyecto
        run: ./mvnw -B compile

      - name: Ejecutar tests
        run: ./mvnw -B test

      - name: Publicar resultados de los tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false