<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020408" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <title>LevelUp Arcade — Pro Mode</title>

    <!-- Tipografías cockpit. Cacheadas en Google CDN, no requieren instalación. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Splash mientras carga Vite, para que NUNCA se vea pantalla blanca. -->
    <style>
      html, body, #root { height: 100%; margin: 0; background: #020408; }
      .boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(ellipse at center, #0a0a1f 0%, #020408 70%);
        color: #a855f7; font-family: 'Orbitron', system-ui, sans-serif;
        letter-spacing: 0.4em; font-size: 0.85rem;
      }
      .boot-splash .dot { animation: blink 1.2s infinite; }
      .boot-splash .dot:nth-child(2) { animation-delay: .2s; }
      .boot-splash .dot:nth-child(3) { animation-delay: .4s; }
      @keyframes blink { 0%, 60%, 100% { opacity: 0.2 } 30% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        INICIANDO COCKPIT<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
