# ============================================================
# Configuración general de LevelUp Arcade
# Valores específicos de entorno van en application-{profile}.yml
# ============================================================

spring:
  application:
    name: LevelUp Arcade

  # --- Datasource (se sobrescribe en application-docker.yml) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup}
    username: ${DB_USER:levelup_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway gestiona el esquema, Hibernate solo valida
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  # --- Flyway: migraciones automáticas ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Thymeleaf ---
  thymeleaf:
    cache: false

server:
  port: 8080
  error:
    include-message: always

# --- Logging ---
logging:
  level:
    root: INFO
    com.leveluparcade: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}
