# ============================================================
# Configuración general de LevelUp Arcade
# Valores específicos de entorno van en application-{profile}.yml
# ============================================================
spring:
  application:
    name: LevelUp Arcade
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # --- Datasource (perfil por defecto: desarrollo local) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup}
    username: ${DB_USER:levelup_user}
    password: ${DB_PASSWORD:levelup_pass_2026}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  # --- Flyway: migraciones automáticas ---
  flyway:
    repair-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Thymeleaf ---
  thymeleaf:
    cache: false

  # --- Multipart: subida de ficheros (imagenes de producto) ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

# --- JWT ---
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
  error:
    include-message: always

# --- Logging ---
logging:
  level:
    root: INFO
    com.leveluparcade: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: TRACE

# --- LevelUp Arcade: configuracion de negocio ---
leveluparcade:
  devoluciones:
    dias-limite: 14
  uploads:
    # Carpeta raiz donde se almacenan los ficheros subidos.
    # En desarrollo local: ./uploads (relativo al cwd).
    # En Docker se sobreescribe a /app/uploads via env LEVELUPARCADE_UPLOADS_PATH
    # y se monta un volumen ./uploads:/app/uploads para que persista.
    path: ${LEVELUPARCADE_UPLOADS_PATH:./uploads}
    imagen-producto:
      tamano: 600
      calidad: 0.85
      max-bytes: 5242880  # 5 MB
  facturas:
    prefijo-numero: "FAC"
    url-verificacion-base: "http://localhost:8080/api/facturas/verificar"
    emisor:
      nombre: "LevelUp Arcade S.L."
      cif: "B12345678"
      direccion: "Calle Falsa 123, 28001 Madrid, España"
      email: "facturacion@leveluparcade.local"
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  base-url: https://openrouter.ai/api/v1
  timeout-ms: 30000
  max-tokens: 500

recaptcha:
  site-key: ${RECAPTCHA_SITE_KEY:}
  secret: ${RECAPTCHA_SECRET:}
  
password-reset:
  token-expiration-hours: 1
  base-url: ${APP_BASE_URL:http://localhost:8080}
  from-email: ${MAIL_USERNAME:noreply@leveluparcade.local}
  from-name: LevelUp Arcade