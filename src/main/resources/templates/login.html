<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesion')}"></head>
<body class="hold-transition login-page" style="background: linear-gradient(135deg, #1a1a2e 0%, #2d2a5e 100%);">

<div class="login-box">
    <div class="card card-outline">
        <div class="card-header text-center">
            <h3 class="m-0" style="background: linear-gradient(90deg, #7f77dd, #5dcaa5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                LevelUp Arcade
            </h3>
        </div>
        <div class="card-body">
            <p class="login-box-msg">Inicia sesion para continuar</p>

            <div th:if="${loginError}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span th:text="${loginError}">Error</span>
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="input-group mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required autofocus>
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>

                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Contrasena" required>
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-lock"></span>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-levelup btn-block">
                            <i class="fas fa-sign-in-alt mr-2"></i> Entrar
                        </button>
                    </div>
                </div>
            </form>

            <p class="mt-3 mb-0 text-center">
                <a th:href="@{/}">Volver al inicio</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
