<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Devoluciones')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav th:replace="~{fragments/header :: header}"></nav>
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <h1>Devoluciones</h1>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">

        <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashOk}"></span>
        </div>
        <div th:if="${flashError}" class="alert alert-danger alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashError}"></span>
        </div>

        <div class="card">
          <div class="card-header">
            <form th:action="@{/admin/devoluciones}" method="get" class="form-inline">
              <label class="mr-2">Estado:</label>
              <select name="estado" class="form-control mr-3"
                      onchange="this.form.submit()">
                <option value="">Todos</option>
                <option th:each="e : ${estados}"
                        th:value="${e}"
                        th:text="${e}"
                        th:selected="${estadoFiltro != null and estadoFiltro.name() == e.name()}"></option>
              </select>

              <label class="mr-2">Cliente ID:</label>
              <input type="number" name="clienteId" th:value="${clienteIdFiltro}"
                     class="form-control mr-2" style="width: 120px;"/>
              <button type="submit" class="btn btn-default">
                <i class="fas fa-search"></i>
              </button>
              <a th:if="${estadoFiltro != null or clienteIdFiltro != null}"
                 th:href="@{/admin/devoluciones}" class="btn btn-link ml-2">Limpiar</a>
            </form>
          </div>

          <div class="card-body table-responsive p-0">
            <table class="table table-hover text-nowrap">
              <thead>
              <tr>
                <th>ID</th>
                <th>Fecha solicitud</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Motivo</th>
                <th class="text-right">Importe</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${devoluciones.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4">
                  No hay devoluciones que mostrar.
                </td>
              </tr>
              <tr th:each="d : ${devoluciones}">
                <td>
                  <a th:href="@{/admin/devoluciones/{id}(id=${d.id})}"
                     th:text="'#' + ${d.id}"></a>
                </td>
                <td th:text="${d.fechaSolicitud != null ? #temporals.format(d.fechaSolicitud, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td>
                  <a th:href="@{/admin/pedidos/{id}(id=${d.pedidoId})}"
                     th:text="'#' + ${d.pedidoId}"></a>
                </td>
                <td th:text="${d.clienteId}"></td>
                <td>
                  <span th:text="${#strings.abbreviate(d.motivo, 50)}"></span>
                </td>
                <td class="text-right">
                  <span th:if="${d.importeDevuelto != null}"
                        th:text="${#numbers.formatDecimal(d.importeDevuelto, 1, 2)} + ' EUR'"></span>
                  <span th:unless="${d.importeDevuelto != null}" class="text-muted">-</span>
                </td>
                <td>
                  <span th:switch="${d.estado.name()}">
                    <span th:case="'SOLICITADA'" class="badge badge-warning">SOLICITADA</span>
                    <span th:case="'APROBADA'" class="badge badge-info">APROBADA</span>
                    <span th:case="'RECHAZADA'" class="badge badge-secondary">RECHAZADA</span>
                    <span th:case="'COMPLETADA'" class="badge badge-success">COMPLETADA</span>
                  </span>
                </td>
                <td class="text-right">
                  <a th:href="@{/admin/devoluciones/{id}(id=${d.id})}"
                     class="btn btn-sm btn-info" title="Ver">
                    <i class="fas fa-eye"></i>
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- Paginacion -->
          <div class="card-footer clearfix" th:if="${pagina.totalPages > 1}">
            <ul class="pagination pagination-sm m-0 float-right">
              <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/devoluciones(page=${pagina.number - 1}, estado=${estadoFiltro}, clienteId=${clienteIdFiltro})}">«</a>
              </li>
              <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Pag. ' + (${pagina.number + 1}) + ' / ' + ${pagina.totalPages}"></span>
              </li>
              <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/devoluciones(page=${pagina.number + 1}, estado=${estadoFiltro}, clienteId=${clienteIdFiltro})}">»</a>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
