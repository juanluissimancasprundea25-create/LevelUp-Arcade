<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bienvenido')}"></head>
<body class="hold-transition">

<div class="wrapper d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg, #1a1a2e 0%, #2d2a5e 100%);">

    <div class="card card-levelup shadow-lg" style="max-width: 540px; width: 90%;">
        <div class="card-body text-center p-5">

            <h1 class="display-5 mb-3" style="background: linear-gradient(90deg, #7f77dd, #5dcaa5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                <span th:text="${titulo}">LevelUp Arcade</span>
            </h1>

            <p class="lead text-muted mb-4" th:text="${mensaje}">Cargando...</p>

            <span class="badge badge-success badge-pill px-3 py-2 mb-4">
                <i class="fas fa-check-circle mr-1"></i> Sistema operativo
            </span>

            <div class="mt-4">
                <a th:href="@{/login}" class="btn btn-levelup btn-lg px-4">
                    <i class="fas fa-sign-in-alt mr-2"></i> Acceder al panel
                </a>
            </div>

            <hr class="my-4">

            <div>
                <span class="badge badge-light mx-1 py-2 px-2">Spring Boot 3.5</span>
                <span class="badge badge-light mx-1 py-2 px-2">Java 21</span>
                <span class="badge badge-light mx-1 py-2 px-2">PostgreSQL 16</span>
                <span class="badge badge-light mx-1 py-2 px-2">Thymeleaf</span>
                <span class="badge badge-light mx-1 py-2 px-2">Docker</span>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
