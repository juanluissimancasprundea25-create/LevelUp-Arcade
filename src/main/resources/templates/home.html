<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragments/head :: head('Inicio')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <h1 class="mb-3">Bienvenido a LevelUp Arcade</h1>
        <p class="lead mb-4">
            Tu tienda especializada en videojuegos, consolas y merchandising gamer
        </p>
        <a th:href="@{/catalogo}" class="btn btn-light btn-lg px-4 mr-2 mb-2">
            <i class="fas fa-store mr-2"></i> Ver catalogo
        </a>
        <a th:href="@{/registro}" class="btn btn-outline-light btn-lg px-4 mb-2">
            <i class="fas fa-user-plus mr-2"></i> Crear cuenta gratis
        </a>
    </div>
</section>

<!-- Features -->
<section class="container my-5">
    <div class="row text-center">
        <div class="col-md-4 mb-4">
            <i class="fas fa-shipping-fast fa-3x mb-3" style="color: var(--levelup-purple);"></i>
            <h4>Envio rapido</h4>
            <p class="text-muted">Recibe tus pedidos en 24-48h</p>
        </div>
        <div class="col-md-4 mb-4">
            <i class="fas fa-shield-alt fa-3x mb-3" style="color: var(--levelup-green);"></i>
            <h4>Pago seguro</h4>
            <p class="text-muted">Tus datos protegidos con HTTPS</p>
        </div>
        <div class="col-md-4 mb-4">
            <i class="fas fa-headset fa-3x mb-3" style="color: var(--levelup-purple);"></i>
            <h4>Atencion 24/7</h4>
            <p class="text-muted">Chatea con nosotros cuando quieras</p>
        </div>
    </div>
</section>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>
</body>
</html>
