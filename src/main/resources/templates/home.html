<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">LevelUp Arcade</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #7f77dd, #5dcaa5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #b4b2a9;
            margin-bottom: 2rem;
        }
        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #1d9e75;
            color: white;
            border-radius: 999px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .stack {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #888780;
        }
        .stack span {
            display: inline-block;
            margin: 0.25rem;
            padding: 0.25rem 0.75rem;
            background: rgba(127, 119, 221, 0.15);
            border: 1px solid rgba(127, 119, 221, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${titulo}">LevelUp Arcade</h1>
        <p th:text="${mensaje}">Cargando...</p>
        <div class="status">✓ Sistema operativo</div>
        <div class="stack">
            <span>Spring Boot 3.5</span>
            <span>Java 21</span>
            <span>PostgreSQL 16</span>
            <span>Thymeleaf</span>
            <span>Docker</span>
        </div>
    </div>
</body>
</html>
