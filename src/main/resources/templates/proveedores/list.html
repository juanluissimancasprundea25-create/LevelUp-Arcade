<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Proveedores')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav th:replace="~{fragments/header :: header}"></nav>
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1>Proveedores</h1></div>
          <div class="col-sm-6 text-right">
            <a th:href="@{/admin/proveedores/nuevo}" class="btn btn-primary">
              <i class="fas fa-plus"></i> Nuevo proveedor
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">

        <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashOk}"></span>
        </div>
        <div th:if="${flashError}" class="alert alert-danger alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashError}"></span>
        </div>

        <div class="card">
          <div class="card-header">
            <form th:action="@{/admin/proveedores}" method="get" class="form-inline">
              <div class="input-group" style="width: 320px;">
                <input type="text" name="q" th:value="${q}" class="form-control"
                       placeholder="Buscar por nombre, CIF, ciudad..."/>
                <div class="input-group-append">
                  <button class="btn btn-default" type="submit">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </div>
              <a th:if="${q != null and !q.isEmpty()}" th:href="@{/admin/proveedores}"
                 class="btn btn-link ml-2">Limpiar</a>
            </form>
          </div>

          <div class="card-body table-responsive p-0">
            <table class="table table-hover text-nowrap">
              <thead>
              <tr>
                <th>ID</th>
                <th>Empresa</th>
                <th>CIF</th>
                <th>Ciudad</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${proveedores.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4">
                  No hay proveedores que mostrar.
                </td>
              </tr>
              <tr th:each="p : ${proveedores}">
                <td th:text="${p.id}"></td>
                <td>
                  <a th:href="@{/admin/proveedores/{id}(id=${p.id})}"
                     th:text="${p.nombreEmpresa}"></a>
                </td>
                <td th:text="${p.cif}"></td>
                <td th:text="${p.ciudad ?: '-'}"></td>
                <td th:text="${p.emailContacto ?: '-'}"></td>
                <td th:text="${p.telefono ?: '-'}"></td>
                <td>
                  <span th:if="${p.activo}" class="badge badge-success">Activo</span>
                  <span th:unless="${p.activo}" class="badge badge-secondary">Inactivo</span>
                </td>
                <td class="text-right">
                  <a th:href="@{/admin/proveedores/{id}(id=${p.id})}"
                     class="btn btn-sm btn-info" title="Ver">
                    <i class="fas fa-eye"></i>
                  </a>
                  <a th:href="@{/admin/proveedores/{id}/editar(id=${p.id})}"
                     class="btn btn-sm btn-warning" title="Editar">
                    <i class="fas fa-edit"></i>
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
