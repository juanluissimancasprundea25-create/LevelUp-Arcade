<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper">
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6"><h1>Detalle de cliente</h1></div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Inicio</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/clientes}">Clientes</a></li>
                            <li class="breadcrumb-item active" th:text="${cliente.nombreCompleto()}">Cliente</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">

                <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <i class="icon fas fa-check"></i> <span th:text="${flashOk}">OK</span>
                </div>

                <div class="card card-levelup">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-user mr-1"></i>
                            <span th:text="${cliente.nombreCompleto()}">Cliente</span>
                            <span th:if="${cliente.activo()}" class="badge badge-success ml-2">Activo</span>
                            <span th:unless="${cliente.activo()}" class="badge badge-secondary ml-2">Inactivo</span>
                        </h3>
                        <div class="card-tools">
                            <a th:href="@{/admin/clientes/{id}/editar(id=${cliente.id()})}" class="btn btn-warning btn-sm">
                                <i class="fas fa-edit mr-1"></i> Editar
                            </a>
                            <form th:action="@{/admin/clientes/{id}/eliminar(id=${cliente.id()})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Seguro que quieres eliminar este cliente? Tambien se borrara su usuario.');">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash mr-1"></i> Eliminar
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">Email</dt>
                            <dd class="col-sm-9" th:text="${cliente.email()}">-</dd>

                            <dt class="col-sm-3">NIF</dt>
                            <dd class="col-sm-9" th:text="${cliente.nif() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Telefono</dt>
                            <dd class="col-sm-9" th:text="${cliente.telefono() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Direccion</dt>
                            <dd class="col-sm-9" th:text="${cliente.direccion() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Ciudad</dt>
                            <dd class="col-sm-9" th:text="${cliente.ciudad() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Codigo postal</dt>
                            <dd class="col-sm-9" th:text="${cliente.codigoPostal() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Pais</dt>
                            <dd class="col-sm-9" th:text="${cliente.pais() ?: '-'}">-</dd>

                            <dt class="col-sm-3">Fecha de alta</dt>
                            <dd class="col-sm-9" th:text="${#temporals.format(cliente.fechaAlta(), 'dd/MM/yyyy HH:mm')}">-</dd>

                            <dt class="col-sm-3">Ultimo login</dt>
                            <dd class="col-sm-9"
                                th:text="${cliente.fechaUltimoLogin() != null ? #temporals.format(cliente.fechaUltimoLogin(), 'dd/MM/yyyy HH:mm') : 'Nunca'}">-</dd>
                        </dl>
                    </div>

                    <div class="card-footer">
                        <a th:href="@{/admin/clientes}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left mr-1"></i> Volver
                        </a>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
