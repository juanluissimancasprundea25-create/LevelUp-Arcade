<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper">
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6"><h1>Clientes</h1></div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
                            <li class="breadcrumb-item active">Clientes</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">

                <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <i class="icon fas fa-check"></i> <span th:text="${flashOk}">OK</span>
                </div>

                <div class="card card-levelup">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-users mr-1"></i>
                            <span th:text="${#lists.size(clientes)} + ' cliente(s)'">0 clientes</span>
                        </h3>
                        <div class="card-tools">
                            <a th:href="@{/clientes/nuevo}" class="btn btn-levelup btn-sm">
                                <i class="fas fa-plus mr-1"></i> Nuevo cliente
                            </a>
                        </div>
                    </div>

                    <div class="card-body">

                        <form th:action="@{/clientes}" method="get" class="form-inline mb-3">
                            <div class="input-group" style="width:100%;">
                                <input type="text" name="q" class="form-control"
                                       placeholder="Buscar por nombre, email o NIF..."
                                       th:value="${q}">
                                <div class="input-group-append">
                                    <button type="submit" class="btn btn-default">
                                        <i class="fas fa-search"></i>
                                    </button>
                                    <a th:href="@{/clientes}" class="btn btn-default" th:if="${q != null and !q.isEmpty()}">
                                        <i class="fas fa-times"></i>
                                    </a>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>NIF</th>
                                        <th>Telefono</th>
                                        <th>Ciudad</th>
                                        <th>Estado</th>
                                        <th class="text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(clientes)}">
                                        <td colspan="8" class="text-center text-muted py-4">
                                            <i class="fas fa-info-circle mr-1"></i>
                                            Sin clientes que mostrar.
                                        </td>
                                    </tr>
                                    <tr th:each="c : ${clientes}">
                                        <td th:text="${c.id()}">1</td>
                                        <td>
                                            <a th:href="@{/clientes/{id}(id=${c.id()})}"
                                               th:text="${c.nombreCompleto()}">Nombre</a>
                                        </td>
                                        <td th:text="${c.email()}">email@ejemplo.com</td>
                                        <td th:text="${c.nif() ?: '-'}">-</td>
                                        <td th:text="${c.telefono() ?: '-'}">-</td>
                                        <td th:text="${c.ciudad() ?: '-'}">-</td>
                                        <td>
                                            <span th:if="${c.activo()}" class="badge badge-success">Activo</span>
                                            <span th:unless="${c.activo()}" class="badge badge-secondary">Inactivo</span>
                                        </td>
                                        <td class="text-right">
                                            <a th:href="@{/clientes/{id}(id=${c.id()})}"
                                               class="btn btn-sm btn-info" title="Ver">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/clientes/{id}/editar(id=${c.id()})}"
                                               class="btn btn-sm btn-warning" title="Editar">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{/clientes/{id}/eliminar(id=${c.id()})}"
                                                  method="post" class="d-inline"
                                                  onsubmit="return confirm('Seguro que quieres eliminar este cliente? Tambien se borrara su usuario.');">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </section>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
