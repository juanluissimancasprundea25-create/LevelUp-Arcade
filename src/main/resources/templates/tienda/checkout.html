<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{tienda/fragments/head :: head('Finalizar compra')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container py-4">

    <h1 class="tienda-titulo mb-4">Finalizar compra</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form th:action="@{/checkout}" method="post">
        <div class="row">

            <!-- Datos de envio y pago -->
            <div class="col-lg-7 mb-4">

                <!-- Envio -->
                <div class="card checkout-card mb-4">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fas fa-truck mr-2"></i>Direccion de envio</h5>
                        <div class="form-group mb-0">
                            <label for="direccionEnvio" class="small text-muted">
                                Direccion completa
                            </label>
                            <textarea id="direccionEnvio" name="direccionEnvio"
                                      class="form-control" rows="2"
                                      maxlength="255"
                                      placeholder="Calle, numero, piso, ciudad, codigo postal"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Metodo de pago -->
                <div class="card checkout-card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fas fa-credit-card mr-2"></i>Metodo de pago</h5>

                        <div class="form-group">
                            <select name="metodoPago" id="metodoPago" class="form-control" required>
                                <option th:each="m : ${metodosPago}"
                                        th:value="${m}"
                                        th:text="${m}">TARJETA</option>
                            </select>
                        </div>

                        <!-- Campos de tarjeta SIMULADOS: NO se envian al backend
                             (sin atributo name) ni se guardan. Solo dan aspecto
                             profesional como pedia el enunciado. -->
                        <div class="border rounded p-3 mt-2 bg-light">
                            <small class="text-muted d-block mb-2">
                                <i class="fas fa-lock mr-1"></i>
                                Datos de pago (demo, no se almacenan)
                            </small>
                            <div class="form-group mb-2">
                                <input type="text" class="form-control"
                                       placeholder="Numero de tarjeta"
                                       inputmode="numeric" autocomplete="off">
                            </div>
                            <div class="form-row">
                                <div class="col-7 mb-2">
                                    <input type="text" class="form-control"
                                           placeholder="MM/AA" autocomplete="off">
                                </div>
                                <div class="col-5 mb-2">
                                    <input type="text" class="form-control"
                                           placeholder="CVV" autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resumen del pedido -->
            <div class="col-lg-5">
                <div class="card checkout-resumen">
                    <div class="card-body">
                        <h5 class="mb-3">Tu pedido</h5>

                        <ul class="list-unstyled mb-3">
                            <li th:each="linea : ${carrito.lineas}"
                                class="d-flex justify-content-between mb-2">
                                <span>
                                    <span th:text="${linea.cantidad}">1</span> x
                                    <span th:text="${linea.producto.nombre}">Producto</span>
                                </span>
                                <span th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </span>
                            </li>
                        </ul>

                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="font-weight-bold">Total</span>
                            <span class="checkout-total"
                                  th:text="${#numbers.formatDecimal(carrito.total, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                0,00 EUR
                            </span>
                        </div>

                        <button type="submit" class="btn btn-tienda btn-block btn-lg">
                            <i class="fas fa-check mr-2"></i> Confirmar y pagar
                        </button>
                        <a th:href="@{/carrito}" class="btn btn-link btn-block text-muted mt-1">
                            Volver al carrito
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>

</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>

</body>
</html>
