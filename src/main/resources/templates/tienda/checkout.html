<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{tienda/fragments/head :: head('Finalizar compra')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container py-4">

    <h1 class="tienda-titulo mb-4">Finalizar compra</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form th:action="@{/checkout}" method="post" id="checkoutForm" novalidate>
        <div class="row">

            <!-- Datos de envio y pago -->
            <div class="col-lg-7 mb-4">

                <!-- Envio -->
                <div class="card checkout-card mb-4">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fas fa-truck mr-2"></i>Direccion de envio</h5>
                        <div class="form-group mb-0">
                            <label for="direccionEnvio" class="small text-muted">
                                Direccion completa
                            </label>
                            <textarea id="direccionEnvio" name="direccionEnvio"
                                      class="form-control" rows="2"
                                      maxlength="255"
                                      placeholder="Calle, numero, piso, ciudad, codigo postal"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Metodo de pago -->
                <div class="card checkout-card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fas fa-credit-card mr-2"></i>Metodo de pago</h5>

                        <div class="form-group">
                            <select name="metodoPago" id="metodoPago" class="form-control" required>
                                <option th:each="m : ${metodosPago}"
                                        th:value="${m}"
                                        th:text="${m}">TARJETA</option>
                            </select>
                        </div>

                        <!-- Campos de tarjeta SIMULADOS: NO se envian al backend
                             (sin atributo name) ni se guardan. Validacion solo
                             client-side: el cliente no puede pagar sin rellenarlos
                             cuando el metodo es TARJETA. -->
                        <div id="bloqueTarjeta" class="border rounded p-3 mt-2 bg-light">
                            <small class="text-muted d-block mb-2">
                                <i class="fas fa-lock mr-1"></i>
                                Datos de pago (demo, no se almacenan)
                            </small>

                            <div class="form-group mb-2">
                                <label for="tarjetaNumero" class="small text-muted mb-1">
                                    Numero de tarjeta
                                </label>
                                <input type="text" id="tarjetaNumero" class="form-control"
                                       placeholder="0000 0000 0000 0000"
                                       inputmode="numeric"
                                       autocomplete="off"
                                       maxlength="19">
                                <div class="invalid-feedback" id="errorTarjetaNumero">
                                    Introduce los 16 digitos de la tarjeta.
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col-7 mb-2">
                                    <label for="tarjetaFecha" class="small text-muted mb-1">
                                        Caducidad (MM/AA)
                                    </label>
                                    <input type="text" id="tarjetaFecha" class="form-control"
                                           placeholder="MM/AA"
                                           inputmode="numeric"
                                           autocomplete="off"
                                           maxlength="5">
                                    <div class="invalid-feedback" id="errorTarjetaFecha">
                                        Formato MM/AA. La tarjeta no puede estar caducada.
                                    </div>
                                </div>
                                <div class="col-5 mb-2">
                                    <label for="tarjetaCvv" class="small text-muted mb-1">
                                        CVV
                                    </label>
                                    <input type="text" id="tarjetaCvv" class="form-control"
                                           placeholder="123"
                                           inputmode="numeric"
                                           autocomplete="off"
                                           maxlength="4">
                                    <div class="invalid-feedback" id="errorTarjetaCvv">
                                        3 o 4 digitos.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resumen del pedido -->
            <div class="col-lg-5">
                <div class="card checkout-resumen">
                    <div class="card-body">
                        <h5 class="mb-3">Tu pedido</h5>

                        <ul class="list-unstyled mb-3">
                            <li th:each="linea : ${carrito.lineas}"
                                class="d-flex justify-content-between mb-2">
                                <span>
                                    <span th:text="${linea.cantidad}">1</span> x
                                    <span th:text="${linea.producto.nombre}">Producto</span>
                                </span>
                                <span th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </span>
                            </li>
                        </ul>

                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="font-weight-bold">Total</span>
                            <span class="checkout-total"
                                  th:text="${#numbers.formatDecimal(carrito.total, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                0,00 EUR
                            </span>
                        </div>

                        <button type="submit" class="btn btn-tienda btn-block btn-lg">
                            <i class="fas fa-check mr-2"></i> Confirmar y pagar
                        </button>
                        <a th:href="@{/carrito}" class="btn btn-link btn-block text-muted mt-1">
                            Volver al carrito
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>

</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>

<script>
(function() {
    'use strict';

    var form        = document.getElementById('checkoutForm');
    var metodoPago  = document.getElementById('metodoPago');
    var bloqueTarj  = document.getElementById('bloqueTarjeta');
    var inpNumero   = document.getElementById('tarjetaNumero');
    var inpFecha    = document.getElementById('tarjetaFecha');
    var inpCvv      = document.getElementById('tarjetaCvv');

    // --- Formateadores -----------------------------------------------------

    // Agrupa el numero de tarjeta en bloques de 4 digitos: "1234 5678 9012 3456"
    inpNumero.addEventListener('input', function(e) {
        var digits = e.target.value.replace(/\D/g, '').slice(0, 16);
        var groups = digits.match(/.{1,4}/g);
        e.target.value = groups ? groups.join(' ') : '';
        clearError(inpNumero);
    });

    // Auto-formato MM/AA: al teclear el 3er digito, se inserta la barra
    inpFecha.addEventListener('input', function(e) {
        var digits = e.target.value.replace(/\D/g, '').slice(0, 4);
        if (digits.length >= 3) {
            e.target.value = digits.slice(0, 2) + '/' + digits.slice(2);
        } else {
            e.target.value = digits;
        }
        clearError(inpFecha);
    });

    // CVV: solo digitos
    inpCvv.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        clearError(inpCvv);
    });

    // --- Toggle visibilidad/obligatoriedad segun metodo de pago -----------

    function esTarjeta() {
        return metodoPago.value === 'TARJETA';
    }

    function actualizarBloqueTarjeta() {
        if (esTarjeta()) {
            bloqueTarj.style.display = '';
        } else {
            bloqueTarj.style.display = 'none';
            // Si el cliente cambia a otro metodo, limpiamos errores
            clearError(inpNumero);
            clearError(inpFecha);
            clearError(inpCvv);
        }
    }
    metodoPago.addEventListener('change', actualizarBloqueTarjeta);
    actualizarBloqueTarjeta();

    // --- Validaciones ------------------------------------------------------

    function setError(input, mensaje) {
        input.classList.add('is-invalid');
        var fb = input.parentElement.querySelector('.invalid-feedback');
        if (fb && mensaje) { fb.textContent = mensaje; }
    }
    function clearError(input) {
        input.classList.remove('is-invalid');
    }

    function validarNumero() {
        var digits = inpNumero.value.replace(/\s/g, '');
        if (digits.length !== 16 || !/^\d{16}$/.test(digits)) {
            setError(inpNumero, 'Introduce los 16 digitos de la tarjeta.');
            return false;
        }
        return true;
    }

    function validarFecha() {
        var v = inpFecha.value.trim();
        var match = v.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
        if (!match) {
            setError(inpFecha, 'Formato MM/AA invalido.');
            return false;
        }
        var mes = parseInt(match[1], 10);
        var anio = 2000 + parseInt(match[2], 10);

        var hoy = new Date();
        // Ultimo dia del mes de caducidad: la tarjeta es valida durante todo
        // el mes que figura impreso (asi funcionan las tarjetas reales).
        var finMes = new Date(anio, mes, 0, 23, 59, 59);

        if (finMes < hoy) {
            setError(inpFecha, 'La tarjeta esta caducada.');
            return false;
        }
        return true;
    }

    function validarCvv() {
        if (!/^\d{3,4}$/.test(inpCvv.value)) {
            setError(inpCvv, 'CVV de 3 o 4 digitos.');
            return false;
        }
        return true;
    }

    // --- Submit ------------------------------------------------------------

    form.addEventListener('submit', function(e) {
        if (!esTarjeta()) { return; } // otros metodos: no validamos tarjeta

        var ok = true;
        if (!validarNumero()) { ok = false; }
        if (!validarFecha())  { ok = false; }
        if (!validarCvv())    { ok = false; }

        if (!ok) {
            e.preventDefault();
            // Foco en el primer campo erroneo
            var primero = bloqueTarj.querySelector('.is-invalid');
            if (primero) { primero.focus(); }
        }
    });
})();
</script>

</body>
</html>
