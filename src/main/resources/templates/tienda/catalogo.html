<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{tienda/fragments/head :: head('Catalogo')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container py-4">

    <!-- Cabecera -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <h1 class="tienda-titulo mb-0">Catalogo</h1>
        <span class="text-muted small">
            <span th:text="${totalProductos}">0</span> producto(s) disponibles
        </span>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${error}" class="alert alert-danger" role="alert"
         th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" role="alert"
         th:text="${info}"></div>

    <!-- Filtros -->
    <form th:action="@{/catalogo}" method="get" class="card card-body mb-4 catalogo-filtros">
        <div class="form-row align-items-end">
            <div class="form-group col-md-5 mb-2">
                <label for="q" class="small font-weight-bold text-muted mb-1">Buscar</label>
                <input type="text" id="q" name="q" class="form-control"
                       placeholder="Nombre, SKU o descripcion"
                       th:value="${q}">
            </div>
            <div class="form-group col-md-3 mb-2">
                <label for="categoria" class="small font-weight-bold text-muted mb-1">Categoria</label>
                <select id="categoria" name="categoria" class="form-control">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${categoriaSeleccionada != null and categoriaSeleccionada == c.id}">
                    </option>
                </select>
            </div>
            <div class="form-group col-md-3 mb-2">
                <label for="orden" class="small font-weight-bold text-muted mb-1">Ordenar por</label>
                <select id="orden" name="orden" class="form-control">
                    <option value="novedad"    th:selected="${orden == 'novedad'}">Novedad</option>
                    <option value="precio_asc" th:selected="${orden == 'precio_asc'}">Precio: menor a mayor</option>
                    <option value="precio_desc" th:selected="${orden == 'precio_desc'}">Precio: mayor a menor</option>
                    <option value="nombre"     th:selected="${orden == 'nombre'}">Nombre (A-Z)</option>
                </select>
            </div>
            <div class="form-group col-md-1 mb-2">
                <button type="submit" class="btn btn-tienda btn-block"
                        aria-label="Buscar en el catalogo">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </form>

    <!-- Resultados -->
    <div th:if="${#lists.isEmpty(productos)}" class="text-center py-5">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <p class="text-muted">No hay productos que coincidan con tu busqueda.</p>
        <a th:href="@{/catalogo}" class="btn btn-outline-secondary btn-sm">
            Limpiar filtros
        </a>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(productos)}">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4"
             th:each="p : ${productos}">
            <a th:href="@{/producto/{id}(id=${p.id})}" class="card producto-card h-100 text-decoration-none">

                <div class="producto-thumb">
                    <!--
                      PR #27: imagenUrl es ahora un path relativo
                      "productos/abc.jpg" servido desde /img/.
                      Compat con URLs http(s) antiguas: se usan tal cual.
                      .producto-thumb ya reserva el cuadrado via CSS
                      (aspect-ratio 1/1 + object-fit cover): cero saltos.
                    -->
                    <img th:if="${p.imagenUrl != null and !#strings.isEmpty(p.imagenUrl)}"
                         th:src="${#strings.startsWith(p.imagenUrl, 'http')
                                  ? p.imagenUrl
                                  : '/img/' + p.imagenUrl}"
                         th:alt="${p.nombre}"
                         loading="lazy"
                         class="card-img-top">
                    <div th:unless="${p.imagenUrl != null and !#strings.isEmpty(p.imagenUrl)}"
                         class="producto-thumb-placeholder">
                        <i class="fas fa-gamepad"></i>
                    </div>

                    <!-- Badge stock -->
                    <span th:if="${p.stock != null and p.stock == 0}"
                          class="badge badge-stock badge-stock-fuera">Sin stock</span>
                    <span th:if="${p.stock != null and p.stock > 0 and p.stock < 5}"
                          class="badge badge-stock badge-stock-bajo">Pocas unidades</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <small class="text-muted text-uppercase"
                           th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoria'}">
                        Categoria
                    </small>
                    <h6 class="card-title mt-1 mb-2 producto-nombre" th:text="${p.nombre}">Nombre</h6>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="producto-precio"
                              th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                            0,00 EUR
                        </span>
                        <small class="text-muted">
                            Stock: <span th:text="${p.stock}">0</span>
                        </small>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Paginacion -->
    <nav th:if="${totalPaginas > 1}" aria-label="Paginacion del catalogo">
        <ul class="pagination justify-content-center mt-3">
            <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalogo(q=${q}, categoria=${categoriaSeleccionada}, orden=${orden}, page=${paginaActual - 1})}">
                    Anterior
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                th:classappend="${i == paginaActual} ? 'active'">
                <a class="page-link"
                   th:href="@{/catalogo(q=${q}, categoria=${categoriaSeleccionada}, orden=${orden}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalogo(q=${q}, categoria=${categoriaSeleccionada}, orden=${orden}, page=${paginaActual + 1})}">
                    Siguiente
                </a>
            </li>
        </ul>
    </nav>

</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>

</body>
</html>
