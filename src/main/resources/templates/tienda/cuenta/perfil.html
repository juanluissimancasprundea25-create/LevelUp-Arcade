<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragments/head :: head('Mi perfil')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">

        <div class="col-lg-3 mb-4">
            <div th:replace="~{tienda/cuenta/_sidebar :: sidebar}"></div>
        </div>

        <div class="col-lg-9">
            <h2 class="tienda-titulo mb-3">Mi perfil</h2>

            <div th:if="${info}" class="alert alert-success" th:text="${info}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card cuenta-card">
                <div class="card-body">
                    <form th:action="@{/cuenta/perfil}" th:object="${perfil}" method="post">

                        <!-- Email (solo lectura) -->
                        <div class="form-group">
                            <label class="small text-muted">Email</label>
                            <input type="email" class="form-control"
                                   th:value="${email}" disabled>
                            <small class="text-muted">
                                <i class="fas fa-info-circle mr-1"></i>
                                Para cambiar el email, contacta con soporte por chat.
                            </small>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-6">
                                <label for="nombre" class="small text-muted">Nombre *</label>
                                <input type="text" id="nombre" class="form-control"
                                       th:field="*{nombre}" maxlength="100" required>
                                <small class="text-danger"
                                       th:if="${#fields.hasErrors('nombre')}"
                                       th:errors="*{nombre}"></small>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="apellidos" class="small text-muted">Apellidos</label>
                                <input type="text" id="apellidos" class="form-control"
                                       th:field="*{apellidos}" maxlength="150">
                                <small class="text-danger"
                                       th:if="${#fields.hasErrors('apellidos')}"
                                       th:errors="*{apellidos}"></small>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="telefono" class="small text-muted">Telefono</label>
                            <input type="tel" id="telefono" class="form-control"
                                   th:field="*{telefono}" maxlength="20">
                            <small class="text-danger"
                                   th:if="${#fields.hasErrors('telefono')}"
                                   th:errors="*{telefono}"></small>
                        </div>

                        <hr>
                        <h6 class="mb-3">Direccion</h6>

                        <div class="form-group">
                            <label for="direccion" class="small text-muted">Direccion</label>
                            <input type="text" id="direccion" class="form-control"
                                   th:field="*{direccion}" maxlength="255">
                        </div>

                        <div class="row">
                            <div class="form-group col-md-5">
                                <label for="ciudad" class="small text-muted">Ciudad</label>
                                <input type="text" id="ciudad" class="form-control"
                                       th:field="*{ciudad}" maxlength="100">
                            </div>
                            <div class="form-group col-md-3">
                                <label for="codigoPostal" class="small text-muted">CP</label>
                                <input type="text" id="codigoPostal" class="form-control"
                                       th:field="*{codigoPostal}" maxlength="10">
                            </div>
                            <div class="form-group col-md-4">
                                <label for="pais" class="small text-muted">Pais</label>
                                <input type="text" id="pais" class="form-control"
                                       th:field="*{pais}" maxlength="100">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-3">
                            <button type="submit" class="btn btn-tienda">
                                <i class="fas fa-save mr-2"></i> Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>
</body>
</html>
