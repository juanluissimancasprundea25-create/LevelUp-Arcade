<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragments/head :: head('Pedido')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">

        <div class="col-lg-3 mb-4">
            <div th:replace="~{tienda/cuenta/_sidebar :: sidebar}"></div>
        </div>

        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="tienda-titulo mb-0">
                    Pedido <span th:text="'#' + ${pedido.id}">#0</span>
                </h2>
                <a th:href="@{/cuenta/pedidos}" class="btn btn-link">
                    <i class="fas fa-arrow-left mr-1"></i> Volver
                </a>
            </div>

            <div class="card cuenta-card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <small class="text-muted d-block">Fecha</small>
                            <span th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}">fecha</span>
                        </div>
                        <div class="col-md-4">
                            <small class="text-muted d-block">Estado</small>
                            <span class="badge" th:classappend="${
                                pedido.estado.name() == 'PAGADO' ? 'badge-success' :
                                pedido.estado.name() == 'ENVIADO' ? 'badge-info' :
                                pedido.estado.name() == 'ENTREGADO' ? 'badge-primary' :
                                pedido.estado.name() == 'CANCELADO' ? 'badge-secondary' :
                                'badge-warning'}"
                                  th:text="${pedido.estado}">ESTADO</span>
                        </div>
                        <div class="col-md-4 text-md-right">
                            <small class="text-muted d-block">Total</small>
                            <span class="checkout-total"
                                  th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                0,00 EUR
                            </span>
                        </div>
                    </div>

                    <!-- Direccion de envio. El metodo de pago NO se muestra por privacidad. -->
                    <div th:if="${pedido.direccionEnvio != null and !#strings.isEmpty(pedido.direccionEnvio)}"
                         class="mb-3">
                        <small class="text-muted d-block">Direccion de envio</small>
                        <span th:text="${pedido.direccionEnvio}">Direccion</span>
                    </div>

                    <hr>

                    <h6>Articulos</h6>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-right">Precio</th>
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="linea : ${pedido.lineas}">
                                <td th:text="${linea.productoNombre}">Producto</td>
                                <td class="text-center" th:text="${linea.cantidad}">1</td>
                                <td class="text-right"
                                    th:text="${#numbers.formatDecimal(linea.precioUnitario, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </td>
                                <td class="text-right"
                                    th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>
</body>
</html>
