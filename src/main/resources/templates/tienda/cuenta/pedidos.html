<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragments/head :: head('Mis pedidos')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">

        <div class="col-lg-3 mb-4">
            <div th:replace="~{tienda/cuenta/_sidebar :: sidebar}"></div>
        </div>

        <div class="col-lg-9">
            <h2 class="tienda-titulo mb-3">Mis pedidos</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

            <div th:if="${#lists.isEmpty(pedidos)}" class="card cuenta-card text-center py-5">
                <div class="card-body">
                    <i class="fas fa-shopping-bag fa-3x text-muted mb-3"></i>
                    <p class="text-muted">Aun no tienes pedidos.</p>
                    <a th:href="@{/catalogo}" class="btn btn-tienda">
                        <i class="fas fa-store mr-2"></i> Ir al catalogo
                    </a>
                </div>
            </div>

            <div th:unless="${#lists.isEmpty(pedidos)}" class="card cuenta-card">
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th class="text-right">Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pedidos}">
                                <td>
                                    <strong th:text="'#' + ${p.id}">#0</strong>
                                </td>
                                <td th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}">
                                    fecha
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${
                                        p.estado.name() == 'PAGADO' ? 'badge-success' :
                                        p.estado.name() == 'ENVIADO' ? 'badge-info' :
                                        p.estado.name() == 'ENTREGADO' ? 'badge-primary' :
                                        p.estado.name() == 'CANCELADO' ? 'badge-secondary' :
                                        'badge-warning'}"
                                          th:text="${p.estado}">ESTADO</span>
                                </td>
                                <td class="text-right font-weight-bold"
                                    th:text="${#numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </td>
                                <td class="text-right">
                                    <a th:href="@{/cuenta/pedidos/{id}(id=${p.id})}"
                                       class="btn btn-sm btn-outline-secondary">
                                        <i class="fas fa-eye"></i> Ver
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>
</body>
</html>
