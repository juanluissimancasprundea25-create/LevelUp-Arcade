<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragments/head :: head('Mi cuenta')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container my-5">

    <h1 class="tienda-titulo mb-4">
        <i class="fas fa-user-circle mr-2"></i>
        Hola, <span th:text="${usuario.nombre}">Cliente</span>
    </h1>

    <p class="lead text-muted">
        Esta es tu zona privada. Pronto podras ver aqui tus pedidos, facturas y devoluciones.
    </p>

    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="card card-cuenta h-100">
                <div class="card-body text-center">
                    <i class="fas fa-shopping-bag fa-3x mb-3 text-primary"></i>
                    <h5>Mis pedidos</h5>
                    <p class="text-muted small">Proximamente</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card card-cuenta h-100">
                <div class="card-body text-center">
                    <i class="fas fa-file-invoice fa-3x mb-3 text-success"></i>
                    <h5>Mis facturas</h5>
                    <p class="text-muted small">Proximamente</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card card-cuenta h-100">
                <div class="card-body text-center">
                    <i class="fas fa-user-cog fa-3x mb-3 text-warning"></i>
                    <h5>Mi perfil</h5>
                    <p class="text-muted small">Proximamente</p>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>
</body>
</html>
