<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{tienda/fragments/head :: head('Pedido confirmado')}"></head>
<body>

<div th:replace="~{tienda/fragments/header :: header}"></div>

<main class="container py-4">

    <!-- Cabecera de exito -->
    <div class="text-center py-4">
        <div class="checkout-ok-icon mb-3">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="tienda-titulo mb-2">Gracias por tu compra</h1>
        <p class="text-muted">
            Tu pedido <strong th:text="'#' + ${pedido.id}">#0</strong> se ha
            confirmado correctamente.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card checkout-card">
                <div class="card-body">

                    <div class="d-flex justify-content-between flex-wrap mb-3">
                        <div>
                            <small class="text-muted d-block">Estado</small>
                            <span class="badge badge-success" th:text="${pedido.estado}">PAGADO</span>
                        </div>
                        <div>
                            <small class="text-muted d-block">Metodo de pago</small>
                            <span th:text="${pedido.metodoPago}">TARJETA</span>
                        </div>
                        <div class="text-right">
                            <small class="text-muted d-block">Total</small>
                            <span class="checkout-total"
                                  th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                0,00 EUR
                            </span>
                        </div>
                    </div>

                    <div th:if="${pedido.direccionEnvio != null and !#strings.isEmpty(pedido.direccionEnvio)}"
                         class="mb-3">
                        <small class="text-muted d-block">Direccion de envio</small>
                        <span th:text="${pedido.direccionEnvio}">Direccion</span>
                    </div>

                    <hr>

                    <h6 class="mb-3">Articulos</h6>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-right">Precio</th>
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="linea : ${pedido.lineas}">
                                <td th:text="${linea.productoNombre}">Producto</td>
                                <td class="text-center" th:text="${linea.cantidad}">1</td>
                                <td class="text-right"
                                    th:text="${#numbers.formatDecimal(linea.precioUnitario, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </td>
                                <td class="text-right"
                                    th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'">
                                    0,00 EUR
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="text-center mt-4">
                        <a th:href="@{/catalogo}" class="btn btn-tienda">
                            <i class="fas fa-store mr-2"></i> Seguir comprando
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{tienda/fragments/footer :: footer}"></div>
<div th:replace="~{tienda/fragments/scripts :: scripts}"></div>

</body>
</html>
