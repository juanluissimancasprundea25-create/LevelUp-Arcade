<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="main-sidebar sidebar-dark-purple elevation-4">
    <!-- Logo -->
    <a th:href="@{/dashboard}" class="brand-link text-center">
        <span class="brand-text font-weight-light">
            <strong>LevelUp</strong> Arcade
        </span>
    </a>

    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">

                <li class="nav-item">
                    <a th:href="@{/dashboard}" class="nav-link">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Dashboard</p>
                    </a>
                    </li>
                    
                    <li class="nav-header">GESTION</li>
                    
                    <li class="nav-item">
                        <a th:href="@{/clientes}" th:classappend="${seccionActiva == 'clientes'} ? 'active'" class="nav-link">
                            <i class="nav-icon fas fa-users"></i>
                            <p>Clientes</p>
                        </a>
                    </li>
                <li class="nav-item">
                    <a th:href="@{/proveedores}" class="nav-link">
                        <i class="nav-icon fas fa-truck"></i>
                        <p>Proveedores</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/productos}" class="nav-link">
                        <i class="nav-icon fas fa-gamepad"></i>
                        <p>Productos</p>
                    </a>
                </li>

                <li class="nav-header">VENTAS</li>

                <li class="nav-item">
                    <a th:href="@{/pedidos}" class="nav-link">
                        <i class="nav-icon fas fa-shopping-cart"></i>
                        <p>Pedidos</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/facturas}" class="nav-link">
                        <i class="nav-icon fas fa-file-invoice"></i>
                        <p>Facturas</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/devoluciones}" class="nav-link">
                        <i class="nav-icon fas fa-undo"></i>
                        <p>Devoluciones</p>
                    </a>
                </li>

                <li class="nav-header">COMUNICACION</li>

                <li class="nav-item">
                    <a th:href="@{/chat}" class="nav-link">
                        <i class="nav-icon fas fa-comments"></i>
                        <p>Chat</p>
                    </a>
                </li>

                <li class="nav-header">ADMINISTRACION</li>

                <li class="nav-item">
                    <a th:href="@{/auditoria}" class="nav-link">
                        <i class="nav-icon fas fa-history"></i>
                        <p>Auditoria</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>
</body>
</html>
