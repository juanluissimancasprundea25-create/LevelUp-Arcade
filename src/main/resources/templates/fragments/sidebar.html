<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="main-sidebar sidebar-dark-purple elevation-4">
    <!-- Logo -->
    <a th:href="@{/admin/dashboard}" class="brand-link text-center">
        <span class="brand-text font-weight-light">
            <strong>LevelUp</strong> Arcade
        </span>
    </a>

    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">

                <li class="nav-item">
                    <a th:href="@{/admin/dashboard}" class="nav-link"
                       th:classappend="${seccionActiva == 'dashboard'} ? 'active'">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <li class="nav-header">GESTION</li>

                <li class="nav-item">
                    <a th:href="@{/admin/clientes}" class="nav-link"
                       th:classappend="${seccionActiva == 'clientes'} ? 'active'">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Clientes</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/proveedores}" class="nav-link"
                       th:classappend="${seccionActiva == 'proveedores'} ? 'active'">
                        <i class="nav-icon fas fa-truck"></i>
                        <p>Proveedores</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/productos}" class="nav-link"
                       th:classappend="${seccionActiva == 'productos'} ? 'active'">
                        <i class="nav-icon fas fa-gamepad"></i>
                        <p>Productos</p>
                    </a>
                </li>

                <li class="nav-header">VENTAS</li>

                <li class="nav-item">
                    <a th:href="@{/admin/pedidos}" class="nav-link"
                       th:classappend="${seccionActiva == 'pedidos'} ? 'active'">
                        <i class="nav-icon fas fa-shopping-cart"></i>
                        <p>Pedidos</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/facturas}" class="nav-link"
                       th:classappend="${seccionActiva == 'facturas'} ? 'active'">
                        <i class="nav-icon fas fa-file-invoice"></i>
                        <p>Facturas</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/devoluciones}" class="nav-link"
                       th:classappend="${seccionActiva == 'devoluciones'} ? 'active'">
                        <i class="nav-icon fas fa-undo"></i>
                        <p>Devoluciones</p>
                    </a>
                </li>

                <li class="nav-header">COMUNICACION</li>

                <li class="nav-item">
                    <a th:href="@{/admin/chat}" class="nav-link"
                       th:classappend="${seccionActiva == 'chat'} ? 'active'">
                        <i class="nav-icon fas fa-comments"></i>
                        <p>Chat</p>
                    </a>
                </li>

                <li class="nav-header">ADMINISTRACION</li>

                <li class="nav-item">
                    <a th:href="@{/admin/auditoria}" class="nav-link"
                       th:classappend="${seccionActiva == 'auditoria'} ? 'active'">
                        <i class="nav-icon fas fa-history"></i>
                        <p>Auditoria</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>
</body>
</html>
