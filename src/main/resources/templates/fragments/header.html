<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="main-header navbar navbar-expand navbar-dark navbar-purple">
    <!-- Toggle del sidebar -->
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                <i class="fas fa-bars"></i>
            </a>
        </li>
    </ul>

    <!-- Derecha: usuario y logout -->
    <ul class="navbar-nav ml-auto">
        <li class="nav-item">
            <span class="nav-link">
                <i class="fas fa-user mr-1"></i>
                <span sec:authentication="name">Admin</span>
            </span>
        </li>
        <li class="nav-item">
            <form th:action="@{/logout}" method="post" class="form-inline">
                <button type="submit" class="btn btn-link nav-link" title="Cerrar sesion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </form>
        </li>
    </ul>
</nav>
</body>
</html>
