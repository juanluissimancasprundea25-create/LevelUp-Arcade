<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Facturas')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav th:replace="~{fragments/header :: header}"></nav>
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <h1>Facturas</h1>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">

        <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashOk}"></span>
        </div>
        <div th:if="${flashError}" class="alert alert-danger alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashError}"></span>
        </div>

        <div class="card">
          <div class="card-header">
            <form th:action="@{/facturas}" method="get" class="form-inline">
              <label class="mr-2">Cliente ID:</label>
              <input type="number" name="clienteId" th:value="${clienteIdFiltro}"
                     class="form-control mr-2" style="width: 120px;"/>
              <button type="submit" class="btn btn-default">
                <i class="fas fa-search"></i>
              </button>
              <a th:if="${clienteIdFiltro != null}" th:href="@{/facturas}"
                 class="btn btn-link ml-2">Limpiar</a>
              <span class="ml-auto text-muted small">
                Para emitir una factura, ve al detalle del pedido y pulsa "Emitir factura".
              </span>
            </form>
          </div>

          <div class="card-body table-responsive p-0">
            <table class="table table-hover text-nowrap">
              <thead>
              <tr>
                <th>Numero</th>
                <th>Fecha emision</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th class="text-right">Total</th>
                <th class="text-right">Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${facturas.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4">
                  No hay facturas que mostrar.
                </td>
              </tr>
              <tr th:each="f : ${facturas}">
                <td>
                  <a th:href="@{/facturas/{id}(id=${f.id})}"
                     th:text="${f.numeroFactura}"></a>
                </td>
                <td th:text="${f.fechaEmision != null ? #temporals.format(f.fechaEmision, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td>
                  <a th:href="@{/pedidos/{id}(id=${f.pedidoId})}"
                     th:text="'#' + ${f.pedidoId}"></a>
                </td>
                <td th:text="${f.clienteNombre}"></td>
                <td class="text-right">
                  <strong th:text="${#numbers.formatDecimal(f.total, 1, 2)} + ' EUR'"></strong>
                </td>
                <td class="text-right">
                  <a th:href="@{/facturas/{id}(id=${f.id})}"
                     class="btn btn-sm btn-info" title="Ver">
                    <i class="fas fa-eye"></i>
                  </a>
                  <a th:href="@{/facturas/{id}/pdf(id=${f.id})}"
                     class="btn btn-sm btn-secondary" title="Descargar PDF">
                    <i class="fas fa-file-pdf"></i>
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="card-footer clearfix" th:if="${pagina.totalPages > 1}">
            <ul class="pagination pagination-sm m-0 float-right">
              <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/facturas(page=${pagina.number - 1}, clienteId=${clienteIdFiltro})}">«</a>
              </li>
              <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Pag. ' + (${pagina.number + 1}) + ' / ' + ${pagina.totalPages}"></span>
              </li>
              <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/facturas(page=${pagina.number + 1}, clienteId=${clienteIdFiltro})}">»</a>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
