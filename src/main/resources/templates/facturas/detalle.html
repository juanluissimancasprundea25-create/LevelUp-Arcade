<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Factura ' + ${factura.numeroFactura})}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav th:replace="~{fragments/header :: header}"></nav>
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-8">
            <h1 th:text="'Factura ' + ${factura.numeroFactura}"></h1>
          </div>
          <div class="col-sm-4 text-right">
            <a th:href="@{/admin/facturas}" class="btn btn-default">
              <i class="fas fa-arrow-left"></i> Volver
            </a>
            <a th:href="@{/admin/facturas/{id}/pdf(id=${factura.id})}"
               class="btn btn-primary">
              <i class="fas fa-file-pdf"></i> Descargar PDF
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">

        <div th:if="${flashOk}" class="alert alert-success alert-dismissible">
          <button type="button" class="close" data-dismiss="alert">&times;</button>
          <span th:text="${flashOk}"></span>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Datos de la factura</h3></div>
          <div class="card-body">
            <dl class="row mb-0">
              <dt class="col-sm-3">Numero</dt>
              <dd class="col-sm-9" th:text="${factura.numeroFactura}"></dd>

              <dt class="col-sm-3">Fecha emision</dt>
              <dd class="col-sm-9"
                  th:text="${factura.fechaEmision != null ? #temporals.format(factura.fechaEmision, 'dd/MM/yyyy HH:mm') : '-'}"></dd>

              <dt class="col-sm-3">Pedido</dt>
              <dd class="col-sm-9">
                <a th:href="@{/admin/pedidos/{id}(id=${factura.pedidoId})}"
                   th:text="'#' + ${factura.pedidoId}"></a>
              </dd>

              <dt class="col-sm-3">Cliente</dt>
              <dd class="col-sm-9">
                <a th:href="@{/admin/clientes/{id}(id=${factura.clienteId})}"
                   th:text="${factura.clienteNombre}"></a>
              </dd>

              <dt class="col-sm-3">Total facturado</dt>
              <dd class="col-sm-9">
                <strong th:text="${#numbers.formatDecimal(factura.total, 1, 2)} + ' EUR'"></strong>
              </dd>
            </dl>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
