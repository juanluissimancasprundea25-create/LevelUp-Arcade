<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificacion de factura | LevelUp Arcade</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"/>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/levelup.css}"/>
  <style>
    body {
      background: linear-gradient(135deg, #7f77dd 0%, #5dcaa5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 1rem;
    }
    .verificacion-card {
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }
    .verificacion-header {
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .header-valida { background: #28a745; }
    .header-invalida { background: #dc3545; }
    .icono-grande {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card verificacion-card">

    <!-- Cabecera segun validez -->
    <div th:if="${valida}" class="verificacion-header header-valida">
      <div class="icono-grande"><i class="fas fa-check-circle"></i></div>
      <h2>Factura verificada</h2>
      <p class="mb-0">Esta factura es autentica.</p>
    </div>

    <div th:unless="${valida}" class="verificacion-header header-invalida">
      <div class="icono-grande"><i class="fas fa-times-circle"></i></div>
      <h2>Factura no encontrada</h2>
      <p class="mb-0">
        No hemos encontrado ninguna factura con el numero
        <strong th:text="${numeroBuscado}"></strong>.
      </p>
    </div>

    <!-- Datos solo si es valida -->
    <div th:if="${valida}" class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-5">Numero de factura</dt>
        <dd class="col-sm-7" th:text="${factura.numeroFactura}"></dd>

        <dt class="col-sm-5">Fecha emision</dt>
        <dd class="col-sm-7"
            th:text="${factura.fechaEmision != null ? #temporals.format(factura.fechaEmision, 'dd/MM/yyyy HH:mm') : '-'}"></dd>

        <dt class="col-sm-5">Cliente</dt>
        <dd class="col-sm-7" th:text="${factura.clienteNombre}"></dd>

        <dt class="col-sm-5">Importe total</dt>
        <dd class="col-sm-7">
          <strong th:text="${#numbers.formatDecimal(factura.total, 1, 2)} + ' EUR'"></strong>
        </dd>
      </dl>
    </div>

    <div class="card-footer text-center text-muted small">
      <strong>LevelUp Arcade</strong> &middot; Sistema de verificacion publica de facturas
    </div>
  </div>
</div>
</body>
</html>
