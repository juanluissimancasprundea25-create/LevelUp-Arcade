<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${modoEdicion} ? 'Editar producto' : 'Nuevo producto')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav th:replace="~{fragments/header :: header}"></nav>
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <h1 th:if="${!modoEdicion}">Nuevo producto</h1>
        <h1 th:if="${modoEdicion}">
          Editar producto <small th:text="${nombreOriginal}"></small>
        </h1>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="card card-primary">
          <div class="card-header">
            <h3 class="card-title">Datos del producto</h3>
          </div>

          <!--
            enctype=multipart/form-data es OBLIGATORIO para que el input
            type="file" se envie. Sin esto el fichero llega vacio.
          -->
          <form th:action="${modoEdicion} ? @{/admin/productos/{id}(id=${productoId})} : @{/admin/productos}"
                th:object="${productoForm}"
                method="post"
                enctype="multipart/form-data">

            <div class="card-body">

              <!-- Errores globales (incluye los de imagen rechazada) -->
              <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
              </div>

              <div class="form-row">
                <div class="form-group col-md-4">
                  <label>SKU *</label>
                  <input type="text" th:field="*{sku}" class="form-control"
                         th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'"
                         placeholder="ej. SNES-001"/>
                  <small class="invalid-feedback" th:if="${#fields.hasErrors('sku')}"
                         th:errors="*{sku}"></small>
                </div>
                <div class="form-group col-md-8">
                  <label>Nombre *</label>
                  <input type="text" th:field="*{nombre}" class="form-control"
                         th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                  <small class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}"></small>
                </div>
              </div>

              <div class="form-group">
                <label>Descripcion</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="3"
                          placeholder="Descripcion del producto (opcional)"></textarea>
              </div>

              <div class="form-row">
                <div class="form-group col-md-4">
                  <label>Precio (EUR) *</label>
                  <input type="number" step="0.01" min="0" th:field="*{precio}"
                         class="form-control"
                         th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"/>
                  <small class="invalid-feedback" th:if="${#fields.hasErrors('precio')}"
                         th:errors="*{precio}"></small>
                </div>
                <div class="form-group col-md-4">
                  <label>Stock *</label>
                  <input type="number" min="0" th:field="*{stock}" class="form-control"
                         th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"/>
                  <small class="invalid-feedback" th:if="${#fields.hasErrors('stock')}"
                         th:errors="*{stock}"></small>
                </div>
                <div class="form-group col-md-4">
                  <label>Stock minimo *</label>
                  <input type="number" min="0" th:field="*{stockMinimo}" class="form-control"
                         th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'"/>
                  <small class="text-muted">Aviso de bajo stock por debajo de este valor.</small>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-md-6">
                  <label>Categoria</label>
                  <select name="categoriaIdForm" class="form-control">
                    <option value="">-- Sin categoria --</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${productoForm.categoria != null and productoForm.categoria.id == c.id}"></option>
                  </select>
                </div>
                <div class="form-group col-md-6">
                  <label>Proveedor</label>
                  <select name="proveedorIdForm" class="form-control">
                    <option value="">-- Sin proveedor --</option>
                    <option th:each="p : ${proveedores}"
                            th:value="${p.id}"
                            th:text="${p.nombreEmpresa}"
                            th:selected="${productoForm.proveedor != null and productoForm.proveedor.id == p.id}"></option>
                  </select>
                </div>
              </div>

              <!-- Imagen del producto -->
              <div class="form-group">
                <label>Imagen del producto</label>

                <!--
                  Layout en dos columnas:
                  - Izquierda: preview cuadrado (siempre 200x200 reservados
                    via aspect-ratio = no salta el layout aunque tarde en
                    cargar). Reserva visual identica para placeholder e img.
                  - Derecha: input file + ayuda.
                -->
                <div class="row align-items-start">
                  <div class="col-md-3">
                    <div id="img-preview-wrap"
                         style="width: 200px; aspect-ratio: 1 / 1;
                                background:#f5f5f5; border:1px solid #e0e0e0;
                                border-radius: 6px; overflow: hidden;
                                display:flex; align-items:center; justify-content:center;">
                      <!-- Imagen actual (en edicion) -->
                      <img id="img-preview"
                           th:if="${modoEdicion and productoForm.imagenUrl != null and !#strings.isEmpty(productoForm.imagenUrl)}"
                           th:src="${#strings.startsWith(productoForm.imagenUrl, 'http')
                                    ? productoForm.imagenUrl
                                    : '/img/' + productoForm.imagenUrl}"
                           alt="Preview"
                           style="width:100%; height:100%; object-fit:cover;">
                      <!-- Placeholder cuando no hay imagen -->
                      <span id="img-placeholder"
                            th:if="${!modoEdicion or productoForm.imagenUrl == null or #strings.isEmpty(productoForm.imagenUrl)}"
                            style="color:#bbb;">
                        <i class="fas fa-image fa-3x"></i>
                      </span>
                    </div>
                  </div>

                  <div class="col-md-9">
                    <input type="file" name="imagenFile" id="imagenFile"
                           class="form-control-file"
                           accept="image/jpeg,image/png,image/webp">
                    <small class="text-muted d-block mt-2">
                      Formatos: JPG, PNG o WEBP. Maximo 5 MB.
                      La imagen se recorta a un cuadrado centrado y se
                      reescala a <strong>600x600 px</strong> para que todas
                      las fichas del catalogo tengan el mismo aspecto.
                    </small>

                    <div th:if="${modoEdicion and productoForm.imagenUrl != null and !#strings.isEmpty(productoForm.imagenUrl)}"
                         class="custom-control custom-checkbox mt-3">
                      <input type="checkbox" class="custom-control-input"
                             id="eliminarImagen" name="eliminarImagen" value="true">
                      <label class="custom-control-label" for="eliminarImagen">
                        Eliminar la imagen actual al guardar
                      </label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <div class="custom-control custom-switch">
                  <input type="checkbox" class="custom-control-input" id="activo"
                         th:field="*{activo}"/>
                  <label class="custom-control-label" for="activo">Producto activo</label>
                </div>
              </div>

            </div>

            <div class="card-footer">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i>
                <span th:text="${modoEdicion} ? 'Guardar cambios' : 'Crear producto'"></span>
              </button>
              <a th:href="@{/admin/productos}" class="btn btn-default">Cancelar</a>
            </div>

          </form>
        </div>
      </div>
    </section>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>

<!--
  Preview en cliente. URL.createObjectURL evita una segunda peticion
  al servidor y se ve al instante. El contenedor ya reserva 200x200
  via aspect-ratio: no hay salto de layout.
-->
<script>
(function(){
    var input = document.getElementById('imagenFile');
    if (!input) return;
    input.addEventListener('change', function(){
        var f = input.files && input.files[0];
        if (!f) return;
        var wrap = document.getElementById('img-preview-wrap');
        var placeholder = document.getElementById('img-placeholder');
        var img = document.getElementById('img-preview');
        if (placeholder) placeholder.remove();
        if (!img) {
            img = document.createElement('img');
            img.id = 'img-preview';
            img.alt = 'Preview';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            wrap.appendChild(img);
        }
        img.src = URL.createObjectURL(f);
    });
})();
</script>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
